name: astrbot_plugin_anime_list
display_name: 你的 AstrBot 追番小助手
desc: 本周连载番剧的节目单与缩略图网格，支持季度新番表与番剧详情卡片
help: |
  /list —— 本周连载节目单（本月与上月开播、仍在播的番）
  /list 2026秋 —— 该季度新番表（也可写 202610）
  /listpic —— 本周连载缩略图网格
  /listpic 2026秋 —— 该季度缩略图网格
  /listpic 番剧名 —— 番剧信息卡片
version: 1.5.2
author: Seira
repo: "https://github.com/Ruoyuezero/astrbot_plugin_anime_list"
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 新番
  - 番剧
  - 追番
  - 日程表
  - 图片渲染
